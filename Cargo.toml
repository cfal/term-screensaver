[package]
name = "term-screensaver"
version = "0.1.0"
edition = "2024"
description = "A procedural terminal screensaver"
license = "MIT"

[dependencies]
chrono = { version = "0.4.45", default-features = false, features = ["clock"] }
crossterm = "0.28.1"
rand = "0.8.7"
signal-hook = "0.3.17"

[profile.release]
opt-level = 3
lto = "fat"
strip = true
